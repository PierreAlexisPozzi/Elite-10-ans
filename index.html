<style>
:root{
  color-scheme: dark;
  --cyan:#33f7e6; --pink:#ff3ea5; --violet:#7b3ff2; --gold:#ffd166;
  --bg:#050510; --bg2:#0d0e1f; --glass:rgba(255,255,255,.06); --line:rgba(255,255,255,.14);
  --txt:#eef0ff; --muted:#9aa0c9;
  --font-h:'Teko',sans-serif; --font-s:'Rajdhani',sans-serif; --font-b:'Inter',sans-serif;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
*{box-sizing:border-box;margin:0;padding:0}
body{
  background:
    radial-gradient(1200px 600px at 15% -10%,#3a1a6b55,transparent),
    radial-gradient(900px 500px at 100% 10%,#0a3d5c66,transparent),
    radial-gradient(800px 500px at 50% 100%,#5c0a4966,transparent),
    var(--bg);
  color:var(--txt);font-family:var(--font-b);line-height:1.55;overflow-x:hidden}
img{max-width:100%;display:block}
.wrap{max-width:760px;margin:0 auto;padding:0 22px}
